name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: hermetic suite
        run: node --test
      - name: bundle syntax
        run: node --check lib/index.js
      - name: host contract (pinned dsh closure)
        run: ./scripts/host-contract-check.sh
